name: Dread list refresh

on:
  schedule:
    # About 06:23 UK time in summer (an hour earlier in winter). GitHub can start scheduled runs late.
    - cron: "23 5 * * *"
  push:
    branches: [main]
    # Editing the list, the script or the page re-checks and republishes straight away. Data commits don't retrigger.
    paths: ["films.json", "refresh.py", "docs/index.html", "docs/app.js", "docs/style.css", "docs/vendor/**", ".github/workflows/refresh.yml"]
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: dread-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: main }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }

      # Poster thumbnails aren't committed; keep them between runs so only new films are downloaded.
      - name: Restore poster cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/p
          key: posters-${{ github.run_id }}
          restore-keys: posters-

      - name: Rebuild the pool (JustWatch UK, Wikidata, posters)
        run: python refresh.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Pool update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Fetch self-hosted fonts
        run: |
          mkdir -p "$RUNNER_TEMP/fonts" "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP/pkg"
          npm pack --silent @fontsource/vt323@5.3.0 @fontsource/ibm-plex-sans@5.3.0 @fontsource/ibm-plex-mono@5.3.0 > /dev/null || true
          for t in fontsource-*.tgz; do
            [ -f "$t" ] || continue
            rm -rf x && mkdir x && tar -xzf "$t" -C x
            for w in 400 500 600; do cp x/package/files/*-latin-$w-normal.woff2 "$RUNNER_TEMP/fonts/" 2>/dev/null || true; done
          done
          ls -l "$RUNNER_TEMP/fonts"

      - name: Publish the page to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site="$(mktemp -d)"
          cp -R docs/. "$site"/
          mkdir -p "$site/fonts"
          cp "$RUNNER_TEMP"/fonts/*.woff2 "$site/fonts/" 2>/dev/null || true
          touch "$site/.nojekyll"
          echo "dreadlist.co.uk" > "$site/CNAME"   # keep the custom domain: a force-push without it drops dreadlist.co.uk
          echo "$(ls "$site/p" 2>/dev/null | wc -l) posters published"
          cd "$site"
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
